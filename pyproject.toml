[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-db"
version = "0.1.0"
description = "Stand-alone, provenance-aware anime metadata SQLite database"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "zstandard>=0.22,<1"]

[project.scripts]
anime-db = "anime_db.cli:main"

[tool.setuptools.packages.find]
include = ["anime_db*"]

[tool.ruff]
target-version = "py311"
line-length = 88
